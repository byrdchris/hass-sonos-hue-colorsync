name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archives
        run: |
          mkdir -p dist
          # Full repository archive
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="dist" \
            --exclude=".venv" \
            --exclude=".pytest_cache" \
            --exclude="__pycache__" \
            -czf "dist/media_hue_sync_${GITHUB_REF_NAME}.tar.gz" .

          # Standard HACS integration zip
          cd custom_components
          zip -r "../dist/media_hue_sync.zip" media_hue_sync -x "**/__pycache__/*"
          cd ..

      - name: Extract Release Notes from CHANGELOG
        run: |
          python3 -c '
          import os, re
          tag = os.environ.get("GITHUB_REF_NAME", "")
          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()
          pattern = rf"# {re.escape(tag)}\s*\n(.*?)(?=\n# v|\Z)"
          m = re.search(pattern, content, re.DOTALL)
          notes = m.group(1).strip() if m else f"Release {tag}"
          with open("dist/RELEASE_NOTES.md", "w", encoding="utf-8") as out:
              out.write(notes + "\n")
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/media_hue_sync_${{ github.ref_name }}.tar.gz
            dist/media_hue_sync.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}