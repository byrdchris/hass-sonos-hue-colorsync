name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archives
        run: |
          mkdir -p dist
          # Full repository archive
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="dist" \
            --exclude=".venv" \
            --exclude=".pytest_cache" \
            --exclude="__pycache__" \
            -czf "dist/media_hue_sync_${GITHUB_REF_NAME}.tar.gz" .

          # Standard HACS integration zip
          cd custom_components
          zip -r "../dist/media_hue_sync.zip" media_hue_sync -x "**/__pycache__/*"
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/media_hue_sync_${{ github.ref_name }}.tar.gz
            dist/media_hue_sync.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}